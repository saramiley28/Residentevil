<script type="module">

import * as THREE
    from "three";

import {
    VRButton
}
from "three/addons/webxr/VRButton.js";

import {
    XRControllerModelFactory
}
from "three/addons/webxr/XRControllerModelFactory.js";

import {
    XRHandModelFactory
}
from "three/addons/webxr/XRHandModelFactory.js";


// ======================================================
// ESCENA
// ======================================================

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x030505
    );

scene.fog =
    new THREE.Fog(
        0x030505,
        5,
        45
    );


// ======================================================
// CÁMARA
// ======================================================

const camera =
    new THREE.PerspectiveCamera(
        70,
        window.innerWidth /
        window.innerHeight,
        .01,
        100
    );

camera.position.set(
    0,
    1.6,
    8
);


// ======================================================
// GRUPO DEL JUGADOR
// ======================================================

const player =
    new THREE.Group();

player.add(
    camera
);

scene.add(
    player
);


// ======================================================
// RENDERER VR
// ======================================================

const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setPixelRatio(
    window.devicePixelRatio
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.xr.enabled = true;

renderer.shadowMap.enabled = true;

document.body.appendChild(
    renderer.domElement
);


// ======================================================
// BOTÓN VR
// ======================================================

const vrButton =
    VRButton.createButton(
        renderer
    );

vrButton.style.position =
    "fixed";

vrButton.style.bottom =
    "20px";

vrButton.style.left =
    "50%";

vrButton.style.transform =
    "translateX(-50%)";

vrButton.style.zIndex =
    "20";

document.body.appendChild(
    vrButton
);


// ======================================================
// LUCES
// ======================================================

const ambient =
    new THREE.HemisphereLight(
        0x667777,
        0x050505,
        .7
    );

scene.add(
    ambient
);


const moon =
    new THREE.DirectionalLight(
        0xaab7c0,
        1
    );

moon.position.set(
    -10,
    20,
    10
);

moon.castShadow = true;

scene.add(
    moon
);


// ======================================================
// SUELO
// ======================================================

const floor =
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            60,
            60
        ),

        new THREE.MeshStandardMaterial({
            color: 0x171a18,
            roughness: 1
        })

    );

floor.rotation.x =
    -Math.PI / 2;

floor.receiveShadow =
    true;

scene.add(
    floor
);


// ======================================================
// CUBOS
// ======================================================

function createBox(
    x,
    y,
    z,
    sx,
    sy,
    sz,
    color
) {

    const mesh =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                sx,
                sy,
                sz
            ),

            new THREE.MeshStandardMaterial({
                color: color,
                roughness: .9
            })

        );

    mesh.position.set(
        x,
        y,
        z
    );

    mesh.castShadow =
        true;

    mesh.receiveShadow =
        true;

    scene.add(
        mesh
    );

    return mesh;

}


// ======================================================
// PAREDES
// ======================================================

createBox(
    -15,
    3,
    0,
    1,
    6,
    50,
    0x252927
);

createBox(
    15,
    3,
    0,
    1,
    6,
    50,
    0x252927
);

createBox(
    0,
    3,
    -25,
    30,
    6,
    1,
    0x202321
);

createBox(
    0,
    3,
    25,
    30,
    6,
    1,
    0x202321
);


// ======================================================
// CAJAS
// ======================================================

for (
    let i = 0;
    i < 30;
    i++
) {

    const x =
        THREE.MathUtils.randFloat(
            -11,
            11
        );

    const z =
        THREE.MathUtils.randFloat(
            -20,
            20
        );

    createBox(
        x,
        .6,
        z,
        1.2,
        1.2,
        1.2,
        0x303532
    );

}


// ======================================================
// LUCES ROJAS
// ======================================================

for (
    let z = -20;
    z <= 20;
    z += 8
) {

    const light =
        new THREE.PointLight(
            0xff211d,
            2,
            12
        );

    light.position.set(
        0,
        4,
        z
    );

    scene.add(
        light
    );

}


// ======================================================
// ZOMBIES
// ======================================================

const zombies = [];

function createZombie(
    x,
    z
) {

    const zombie =
        new THREE.Group();


    const body =
        new THREE.Mesh(

            new THREE.CapsuleGeometry(
                .5,
                1,
                5,
                8
            ),

            new THREE.MeshStandardMaterial({
                color: 0x4b5750
            })

        );

    body.position.y =
        1.05;

    body.castShadow = true;

    zombie.add(
        body
    );


    const head =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .42,
                16,
                12
            ),

            new THREE.MeshStandardMaterial({
                color: 0x667269
            })

        );

    head.position.y =
        2;

    head.castShadow = true;

    zombie.add(
        head
    );


    // OJOS

    const eyeMaterial =
        new THREE.MeshBasicMaterial({
            color: 0xff0000
        });


    for (
        const xEye of [-.13, .13]
    ) {

        const eye =
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    .06,
                    8,
                    8
                ),
                eyeMaterial
            );

        eye.position.set(
            xEye,
            2.05,
            -.38
        );

        zombie.add(
            eye
        );

    }


    // BRAZOS

    for (
        const side of [-1, 1]
    ) {

        const arm =
            new THREE.Mesh(

                new THREE.CylinderGeometry(
                    .12,
                    .16,
                    1.2,
                    8
                ),

                new THREE.MeshStandardMaterial({
                    color: 0x56635b
                })

            );

        arm.position.set(
            side * .65,
            1.3,
            -.1
        );

        arm.rotation.z =
            side * .6;

        zombie.add(
            arm
        );

    }


    zombie.position.set(
        x,
        0,
        z
    );


    scene.add(
        zombie
    );


    zombies.push({

        object: zombie,

        health: 3,

        alive: true,

        speed:
            .35 +
            Math.random() * .3

    });

}


// ======================================================
// CREAR ZOMBIES
// ======================================================

createZombie(
    -8,
    -8
);

createZombie(
    8,
    -5
);

createZombie(
    -9,
    3
);

createZombie(
    9,
    7
);

createZombie(
    -5,
    -15
);

createZombie(
    6,
    -18
);


// ======================================================
// CONTROLES VR
// ======================================================

const controllerFactory =
    new XRControllerModelFactory();

const handFactory =
    new XRHandModelFactory();


const controllers = [];


// CONTROLADOR IZQUIERDO

const controller1 =
    renderer.xr.getController(0);

player.add(
    controller1
);

controllers.push(
    controller1
);


// CONTROLADOR DERECHO

const controller2 =
    renderer.xr.getController(1);

player.add(
    controller2
);

controllers.push(
    controller2
);


// MODELOS DE CONTROLADORES

const grip1 =
    renderer.xr.getControllerGrip(0);

grip1.add(
    controllerFactory.createControllerModel(
        grip1
    )
);

player.add(
    grip1
);


const grip2 =
    renderer.xr.getControllerGrip(1);

grip2.add(
    controllerFactory.createControllerModel(
        grip2
    )
);

player.add(
    grip2
);


// ======================================================
// MANOS VR
// ======================================================

const hand1 =
    renderer.xr.getHand(0);

const handModel1 =
    handFactory.createHandModel(
        hand1,
        "mesh"
    );

hand1.add(
    handModel1
);

player.add(
    hand1
);


const hand2 =
    renderer.xr.getHand(1);

const handModel2 =
    handFactory.createHandModel(
        hand2,
        "mesh"
    );

hand2.add(
    handModel2
);

player.add(
    hand2
);


// ======================================================
// EVENTO DE DISPARO
// ======================================================

let ammo = 30;

let health = 100;


function shoot(
    controller
) {

    if (
        ammo <= 0
    ) {

        showMessage(
            "SIN MUNICIÓN"
        );

        return;

    }


    ammo--;

    document
        .getElementById(
            "ammo"
        )
        .textContent =
        ammo;


    const ray =
        new THREE.Raycaster();


    const origin =
        new THREE.Vector3();


    const direction =
        new THREE.Vector3(
            0,
            0,
            -1
        );


    controller.getWorldPosition(
        origin
    );


    direction.applyQuaternion(
        controller.quaternion
    );


    ray.set(
        origin,
        direction
    );


    const targets = [];


    zombies.forEach(
        zombie => {

            if (
                zombie.alive
            ) {

                targets.push(
                    zombie.object
                );

            }

        }
    );


    const hits =
        ray.intersectObjects(
            targets,
            true
        );


    if (
        hits.length === 0
    ) {

        return;

    }


    let hitObject =
        hits[0].object;


    let zombie =
        null;


    while (
        hitObject
    ) {

        zombie =
            zombies.find(
                z =>
                    z.object ===
                    hitObject
            );


        if (
            zombie
        ) {

            break;

        }


        hitObject =
            hitObject.parent;

    }


    if (
        zombie
    ) {

        zombie.health--;


        if (
            zombie.health <= 0
        ) {

            zombie.alive =
                false;

            scene.remove(
                zombie.object
            );

            updateZombieCount();

            showMessage(
                "ZOMBIE ELIMINADO"
            );

        }

    }

}


// ======================================================
// BOTÓN DEL CONTROLADOR
// ======================================================

controller1.addEventListener(
    "selectstart",
    () => {

        shoot(
            controller1
        );

    }
);


controller2.addEventListener(
    "selectstart",
    () => {

        shoot(
            controller2
        );

    }
);


// ======================================================
// SOPORTE DE MANOS
// ======================================================

// En visores que entregan eventos de selección
// mediante hand tracking, también intentamos
// disparar cuando el usuario hace un gesto
// de selección/pellizco.

hand1.addEventListener(
    "selectstart",
    () => {

        shoot(
            hand1
        );

    }
);


hand2.addEventListener(
    "selectstart",
    () => {

        shoot(
            hand2
        );

    }
);


// ======================================================
// IA
// ======================================================

let attackTimer = 0;


function updateZombies(
    delta
) {

    attackTimer +=
        delta;


    const playerPosition =
        new THREE.Vector3();


    player.getWorldPosition(
        playerPosition
    );


    zombies.forEach(
        zombie => {

            if (
                !zombie.alive
            ) {

                return;

            }


            const target =
                new THREE.Vector3(
                    playerPosition.x,
                    0,
                    playerPosition.z
                );


            const position =
                zombie.object.position;


            const distance =
                position.distanceTo(
                    target
                );


            if (
                distance < 30
            ) {

                const direction =
                    target
                    .clone()
                    .sub(
                        position
                    )
                    .normalize();


                position.addScaledVector(
                    direction,
                    zombie.speed *
                    delta
                );


                zombie.object.lookAt(
                    target.x,
                    1,
                    target.z
                );


                if (
                    distance < 1.5 &&
                    attackTimer > 1
                ) {

                    damagePlayer(
                        8
                    );

                    attackTimer =
                        0;

                }

            }

        }
    );

}


// ======================================================
// DAÑO
// ======================================================

function damagePlayer(
    amount
) {

    health -=
        amount;


    health =
        Math.max(
            0,
            health
        );


    document
        .getElementById(
            "health"
        )
        .style.width =
        health + "%";


    if (
        health <= 0
    ) {

        showMessage(
            "HAS PERDIDO"
        );

    }

}


// ======================================================
// CONTADOR
// ======================================================

function updateZombieCount() {

    const alive =
        zombies.filter(
            z =>
                z.alive
        ).length;


    document
        .getElementById(
            "zombieCount"
        )
        .textContent =
        alive;


    if (
        alive === 0
    ) {

        showMessage(
            "¡HAS ELIMINADO A TODOS!"
        );

    }

}


// ======================================================
// MENSAJES
// ======================================================

function showMessage(
    text
) {

    const message =
        document
            .getElementById(
                "mensaje"
            );


    message.textContent =
        text;


    message.style.opacity =
        "1";


    setTimeout(
        () => {

            message.style.opacity =
                "0";

        },
        1800
    );

}


// ======================================================
// INICIAR
// ======================================================

document
    .getElementById(
        "start"
    )
    .addEventListener(
        "click",
        () => {

            document
                .getElementById(
                    "menu"
                )
                .style.display =
                "none";

            showMessage(
                "¡SOBREVIVE!"
            );

        }
    );


// ======================================================
// LOOP VR
// ======================================================

const clock =
    new THREE.Clock();


renderer.setAnimationLoop(
    () => {

        const delta =
            Math.min(
                clock.getDelta(),
                .05
            );


        updateZombies(
            delta
        );


        renderer.render(
            scene,
            camera
        );

    }
);


// ======================================================
// RESIZE
// ======================================================

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
